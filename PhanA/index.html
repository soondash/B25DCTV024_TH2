<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thư Viện Lớp - Phần A (JS Thuần)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-left">
      <h1>📚 Thư Viện Lớp AIoT</h1>
    </div>
    <div class="header-right">
      <div class="fav-badge">
        ❤️ Yêu thích: <span id="fav-count">0</span>
      </div>
      <button id="theme-toggle" class="btn-secondary" type="button">🌙 Chế độ tối</button>
    </div>
  </header>

  <main class="container">
    <!-- Form thêm sách mới -->
    <section class="panel">
      <h2>Thêm sách mới</h2>
      <form id="add-book-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="title">Tên sách (*)</label>
            <input type="text" id="title" placeholder="Nhập ít nhất 3 ký tự..." />
            <small class="error-msg" id="error-title"></small>
          </div>

          <div class="form-group">
            <label for="author">Tác giả (*)</label>
            <input type="text" id="author" placeholder="Nhập tên tác giả..." />
            <small class="error-msg" id="error-author"></small>
          </div>

          <div class="form-group">
            <label for="genre">Thể loại (*)</label>
            <select id="genre">
              <option value="">-- Chọn thể loại --</option>
              <option value="Công nghệ">Công nghệ</option>
              <option value="Khoa học">Khoa học</option>
              <option value="Kỹ năng">Kỹ năng</option>
              <option value="Văn học">Văn học</option>
            </select>
            <small class="error-msg" id="error-genre"></small>
          </div>

          <div class="form-group">
            <label for="year">Năm xuất bản (*)</label>
            <input type="number" id="year" placeholder="1900 - 2026" />
            <small class="error-msg" id="error-year"></small>
          </div>
        </div>
        <button type="submit" class="btn-primary">+ Thêm sách</button>
      </form>
    </section>

    <!-- Thanh công cụ tìm kiếm & lọc -->
    <section class="toolbar panel">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="🔍 Tìm kiếm theo tên sách..." />
      </div>
      <div class="filter-box">
        <select id="genre-filter">
          <option value="ALL">Tất cả thể loại</option>
        </select>
      </div>
    </section>

    <!-- Dòng trạng thái -->
    <section class="status-section">
      <p id="status-bar" class="status-text">Đang tải...</p>
    </section>

    <!-- Lưới hiển thị thẻ sách -->
    <section id="book-grid" class="book-grid"></section>
  </main>

  <footer class="footer">
    <p>Bài thực hành 02 - Lập trình Web (Phần A: Vanilla JS)</p>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
